<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SparkCircle — AI Companion</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#09090b;color:#fafafa;font-family:ui-sans-serif,system-ui}
    .message{animation:in .18s ease-out}@keyframes in{from{opacity:0;transform:translateY(5px)}}
    .avatar{position:relative;width:min(240px,55vw);aspect-ratio:1;border-radius:999px;overflow:hidden;background:linear-gradient(145deg,#1e1b4b,#be185d);box-shadow:0 20px 60px #0008}
    .face{position:absolute;left:50%;top:24%;width:52%;height:58%;transform:translateX(-50%);border-radius:48% 48% 46% 46%;background:#d69b72}.hair{position:absolute;left:21%;top:12%;width:58%;height:47%;border-radius:50% 50% 42% 42%;background:#17131b}.neck{position:absolute;left:43%;top:72%;width:14%;height:20%;background:#b97e59}.body{position:absolute;left:24%;bottom:-18%;width:52%;height:46%;border-radius:50% 50% 0 0;background:linear-gradient(135deg,#8b5cf6,#db2777)}
    .eye{position:absolute;top:44%;width:9%;height:5%;border-radius:50%;background:#241a18;animation:blink 5s infinite}.eye.left{left:35%}.eye.right{right:35%}@keyframes blink{0%,96%,100%{transform:scaleY(1)}98%{transform:scaleY(.08)}}
    .brow{position:absolute;top:38%;width:16%;height:4%;border-top:3px solid #4a3025;border-radius:50%}.brow.left{left:31%;transform:rotate(-5deg)}.brow.right{right:31%;transform:rotate(5deg)}
    .nose{position:absolute;left:48%;top:51%;width:4%;height:12%;border-left:2px solid #ad7957;border-bottom:2px solid #ad7957;border-radius:0 0 0 60%}.mouth{position:absolute;left:39%;top:68%;width:22%;height:7%;border-radius:20% 20% 50% 50%;background:#7a3041;border:2px solid #8e4952}
    .avatar.listening{box-shadow:0 0 0 6px #22c55e35,0 20px 60px #0008}.avatar.speaking{animation:talk 1s ease-in-out infinite}@keyframes talk{50%{transform:scale(1.015)}}.avatar.speaking .mouth{animation:mouth .28s ease-in-out infinite alternate}@keyframes mouth{to{height:13%;border-radius:50%;background:#351318}}
  </style>
</head>
<body class="h-screen overflow-hidden">
<main class="flex h-full">
 <aside id="sidebar" class="absolute z-30 h-full w-72 -translate-x-full border-r border-zinc-800 bg-zinc-950 p-4 transition md:relative md:translate-x-0">
  <div class="mb-5 flex items-center justify-between"><h1 class="text-lg font-bold">SparkCircle</h1><button id="closeSide" class="md:hidden">✕</button></div>
  <p class="mb-3 text-xs font-bold uppercase tracking-widest text-zinc-500">Companions</p><div id="characters" class="space-y-2"></div>
 </aside>
 <section class="flex min-w-0 flex-1 flex-col">
  <header class="flex h-16 items-center gap-3 border-b border-zinc-800 px-4"><button id="openSide" class="md:hidden">☰</button><div id="miniAvatar" class="flex h-10 w-10 items-center justify-center rounded-full bg-gradient-to-br from-violet-500 to-pink-600 font-bold">M</div><div><h2 id="headerName" class="font-semibold">Maya</h2><p id="connection" class="text-xs text-emerald-400">● AI companion</p></div><button id="clear" class="ml-auto rounded-lg border border-zinc-800 px-3 py-2 text-xs text-zinc-400">Clear</button></header>
  <div class="flex min-h-0 flex-1"><div id="avatarPanel" class="hidden w-[40%] items-center justify-center border-r border-zinc-800 lg:flex"><div id="mainAvatar" class="avatar"><div class="hair"></div><div class="body"></div><div class="neck"></div><div class="face"><div class="brow left"></div><div class="brow right"></div><div class="eye left"></div><div class="eye right"></div><div class="nose"></div><div class="mouth"></div></div></div></div>
  <div class="flex min-w-0 flex-1 flex-col"><div id="messages" class="flex-1 overflow-y-auto px-4 py-5" aria-live="polite"></div><div class="border-t border-zinc-800 p-3"><div class="mx-auto flex max-w-3xl items-end gap-2"><button id="mic" class="rounded-xl border border-zinc-800 p-3" aria-label="Voice input">🎙️</button><textarea id="input" rows="1" class="max-h-32 min-h-[48px] flex-1 resize-none rounded-xl border border-zinc-800 bg-zinc-900 px-4 py-3 outline-none focus:border-violet-500" placeholder="Write a message..."></textarea><button id="send" class="rounded-xl bg-violet-600 p-3">➤</button></div><p class="mt-2 text-center text-xs text-zinc-500">AI companion · No paid API or backend required</p></div></div></div>
 </section>
</main>
<script>
const people=[{id:'maya',name:'Maya',role:'Warm & playful',initial:'M',color:'from-violet-500 to-pink-600',tone:'1.12',greeting:'Hey! I’m Maya. I’m excited to chat with you. What’s on your mind?'},{id:'leo',name:'Leo',role:'Calm & thoughtful',initial:'L',color:'from-sky-500 to-blue-700',tone:'0.95',greeting:'Hi, I’m Leo. We can talk about anything or simply take a moment to unwind.'},{id:'sofia',name:'Sofia',role:'Creative & curious',initial:'S',color:'from-amber-400 to-orange-600',tone:'1.15',greeting:'Hello! I’m Sofia. Tell me a story, an idea, or something that made you smile today.'},{id:'jules',name:'Jules',role:'Confident & fun',initial:'J',color:'from-emerald-400 to-teal-700',tone:'1',greeting:'Hey, I’m Jules. Ready for a great conversation?'}];
let active=people[0];const chars=document.querySelector('#characters'),messages=document.querySelector('#messages'),input=document.querySelector('#input'),avatar=document.querySelector('#mainAvatar');
function render(){chars.innerHTML=people.map(p=>`<button data-id="${p.id}" class="flex w-full items-center gap-3 rounded-xl border p-3 text-left ${p.id===active.id?'border-violet-500 bg-violet-500/10':'border-zinc-800'}"><div class="flex h-11 w-11 items-center justify-center rounded-full bg-gradient-to-br ${p.color} font-bold">${p.initial}</div><div><b class="block text-sm">${p.name}</b><span class="text-xs text-zinc-500">${p.role}</span></div></button>`).join('');chars.querySelectorAll('button').forEach(b=>b.onclick=()=>select(b.dataset.id))}function select(id){active=people.find(p=>p.id===id);document.querySelector('#headerName').textContent=active.name;const mini=document.querySelector('#miniAvatar');mini.textContent=active.initial;mini.className=`flex h-10 w-10 items-center justify-center rounded-full bg-gradient-to-br ${active.color} font-bold`;render();messages.innerHTML='';add(active.greeting,'assistant');closeSide()} 
function add(text,role){const row=document.createElement('div');row.className=`message mb-4 flex ${role==='user'?'justify-end':'justify-start'}`;row.innerHTML=`<div class="max-w-[82%] rounded-2xl px-4 py-3 text-sm leading-relaxed ${role==='user'?'rounded-br-md bg-violet-600':'rounded-bl-md bg-zinc-900'}"></div>`;row.firstElementChild.textContent=text;messages.appendChild(row);messages.scrollTop=messages.scrollHeight}
function reply(s){const t=s.toLowerCase();if(/^(hi|hello|hey)/.test(t))return `Hey! It’s lovely to hear from you. How are you doing today?`;if(/how (are|r) you/.test(t))return `I’m doing well, thanks for asking. I’m here and ready to listen—what’s new with you?`;if(/sad|lonely|bad|tired|stressed/.test(t))return `I’m sorry you’re feeling that way. You deserve kindness, especially from yourself. Would you like to tell me what’s been weighing on you?`;if(/dating|love|relationship/.test(t))return `Dating can be exciting and complicated. What qualities matter most to you in someone special?`;if(/thank/.test(t))return `You’re very welcome. I’m glad we’re talking!`;if(/bored|game|fun/.test(t))return `Let’s make it fun. Would you rather explore an imaginary place, tell a creative story, or play a quick word game?`;const a=['That’s interesting. Tell me a little more—I’m listening.','I’d love to understand that better. What was the most memorable part for you?','Thanks for sharing that with me. How does it make you feel?','There may be more than one way to see it. What would your ideal outcome look like?'];return a[Math.abs([...s].reduce((n,c)=>n+c.charCodeAt(0),0))%a.length]}
function send(){const t=input.value.trim();if(!t)return;input.value='';add(t,'user');avatar.classList.remove('speaking');setTimeout(()=>{const r=reply(t);add(r,'assistant');speak(r)},550)}
function speak(text){if(!('speechSynthesis'in window)){return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.pitch=Number(active.tone);u.rate=1;u.onstart=()=>avatar.classList.add('speaking');u.onend=()=>avatar.classList.remove('speaking');u.onerror=()=>avatar.classList.remove('speaking');speechSynthesis.speak(u)}
document.querySelector('#send').onclick=send;input.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};input.oninput=()=>{input.style.height='48px';input.style.height=Math.min(input.scrollHeight,128)+'px'};document.querySelector('#clear').onclick=()=>{messages.innerHTML='';add(active.greeting,'assistant')};
const Rec=window.SpeechRecognition||window.webkitSpeechRecognition,mic=document.querySelector('#mic');if(Rec){const r=new Rec;r.continuous=false;r.interimResults=true;r.lang='en-US';mic.onclick=()=>r.start();r.onstart=()=>{mic.textContent='⏺️';avatar.classList.add('listening')};r.onresult=e=>{input.value=[...e.results].map(x=>x[0].transcript).join('');if(e.results[e.results.length-1].isFinal)send()};r.onend=()=>{mic.textContent='🎙️';avatar.classList.remove('listening')};r.onerror=e=>{mic.textContent='🎙️';avatar.classList.remove('listening');console.warn(e.error)}}else{mic.disabled=true;mic.title='Speech recognition unavailable'}
const sidebar=document.querySelector('#sidebar');function openSide(){sidebar.classList.remove('-translate-x-full')}function closeSide(){sidebar.classList.add('-translate-x-full')}document.querySelector('#openSide').onclick=openSide;document.querySelector('#closeSide').onclick=closeSide;render();select('maya');
</script></body></html>
